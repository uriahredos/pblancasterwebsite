# Render blueprint: one web service with a persistent disk for the database and photos.
services:
  - type: web
    name: branch-portal
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: portal-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/New_York
      - key: BASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_TO
        sync: false
      - key: COMPLAINT_NOTIFY_TO
        sync: false
